[tools]
# Mise selects amd64/aarch64 release artifacts as appropriate.
node = "24"
"npm:@openai/codex" = "latest"
gh = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
"github:arxanas/git-branchless" = "0.11.1"

[hooks]
enter = 'if [ "$(id -un)" = root ]; then "{{config_root}}/bootstrap-in-enroot.sh"; fi'

[tasks.check]
description = "Check the NGC and developer-tool environment"
run = "./scripts/check-env.sh"

[tasks.python-deps]
description = "Install only the Python tools missing from the NGC image"
run = "python -m pip install -r requirements-dev.txt"

[bootstrap.packages]
"apt:bash" = "latest"
"apt:bubblewrap" = "latest"
"apt:ca-certificates" = "latest"
"apt:clangd" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:fish" = "latest"
"apt:git" = "latest"
"apt:htop" = "latest"
"apt:jq" = "latest"
"apt:libarchive-tools" = "latest"
"apt:libdw-dev" = "latest"
"apt:socat" = "latest"
"apt:sudo" = "latest"
"apt:tmux" = "latest"
"apt:tree" = "latest"
"apt:wget" = "latest"
